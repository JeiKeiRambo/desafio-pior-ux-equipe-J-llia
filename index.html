<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta de Acesso</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Área onde os tomates serão criados -->
    <div id="tomates"></div>

    <main class="container">

        <h1>CRIAR CONTA DE ACESSO!!!</h1>

        <p class="intro">
            Preencha os seus dados rapidamente abaixo.
            NÃO DEMORE!!!
        </p>


        <form id="formulario">

            <!-- NOME -->

            <div class="campo nome">

                <label for="nome">
                    NOME COMPLETO:
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome..."
                    autocomplete="off"
                >

                <span id="mensagemNome">
                    O tempo para digitar o nome acabou!
                </span>

            </div>


            <!-- SENHA -->

            <div class="campo senha">

                <label for="senha">
                    SENHA:
                </label>

                <input
                    type="text"
                    id="senha"
                    placeholder="Digite sua senha..."
                    autocomplete="off"
                >

            </div>


            <!-- REGRA ABSURDA -->

            <p class="regra">
                ⚠️ A SENHA DEVE TER EXATAMENTE
                12 NÚMEROS E UM EMOJI DE FRUTA 🍎
            </p>


            <!-- BOTÕES -->

            <div class="botoes">

                <button
                    type="button"
                    id="cancelar"
                    class="cancelar"
                >
                    CANCELAR
                </button>


                <button
                    type="submit"
                    id="avancar"
                    class="avancar"
                >
                    AVANÇAR
                </button>

            </div>

        </form>


        <!-- TELA FINAL -->

        <section
            id="final"
            class="parabens escondido"
        >

            <h2>
                🎉 PARABÉNS!!! 🎉
            </h2>

            <p>
                VOCÊ CONSEGUIU SOBREVIVER À PIOR
                EXPERIÊNCIA DE USUÁRIO!
            </p>

            <p>
                🍅 🍅 🍅 VOCÊ VENCEU! 🍅 🍅 🍅
            </p>

        </section>

    </main>


    <!-- MENSAGEM DE ERRO/CAOS -->

    <div id="mensagemCaos"></div>


    <script src="script.js"></script>

</body>

</html>
